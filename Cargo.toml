[package]
name = "focus-capture"
version = "1.0.0"
edition = "2021"
license = "Unlicense"
description = "MicYou native DSP plugin: hotkey-toggled per-process audio capture (Windows / Linux / macOS), mixed into the mic stream"
publish = false

# Standalone crate: build on demand with `cargo build --release`
# (not part of any workspace, mirrors an external plugin author's setup)
[workspace]

[lib]
name = "focus_capture"
crate-type = ["cdylib"]

[dependencies]
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = "0.8"
x11rb = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_Media_Multimedia",
  "Win32_Security",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Threading",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Kernel",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }
# windows-implement（#[implement] 宏）生成的代码用 ::windows_core 绝对路径引用
# 核心类型，因此插件 crate 需直接依赖它（与 windows 版本锁步）。
windows-core = "0.62"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
# 绝不设置 panic = "abort"：本 cdylib 运行在宿主进程内，abort 会直接带走整个
# MicYou；保持 unwind 才能让 lib.rs 的 catch_unwind 把插件内部 panic 挡在
# FFI 边界内。
